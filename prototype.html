<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>梅花心易 占断プロトタイプ</title>
  <style>
    body { font-family: "Hiragino Kaku Gothic Pro", sans-serif; max-width: 680px; margin: 40px auto; padding: 0 20px; background: #0f0f1a; color: #e8e0d0; }
    h1 { text-align: center; color: #c9a96e; letter-spacing: .1em; }
    label { display: block; margin-top: 16px; font-size: .85em; color: #a09880; }
    select, input { width: 100%; padding: 8px 10px; margin-top: 4px; background: #1e1e2e; border: 1px solid #444; border-radius: 6px; color: #e8e0d0; font-size: 1em; box-sizing: border-box; }
    button { margin-top: 24px; width: 100%; padding: 12px; background: #c9a96e; color: #0f0f1a; font-size: 1em; font-weight: bold; border: none; border-radius: 8px; cursor: pointer; }
    button:hover { background: #e0c080; }
    #result { margin-top: 28px; padding: 20px; background: #1a1a2e; border-left: 3px solid #c9a96e; border-radius: 6px; line-height: 1.8; white-space: pre-wrap; min-height: 60px; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: .78em; margin-bottom: 10px; }
    .GOOD    { background: #1a3a2a; color: #6fcf97; }
    .BAD     { background: #3a1a1a; color: #eb5757; }
    .NEUTRAL { background: #2a2a1a; color: #f2c94c; }
    #loading { display: none; text-align: center; color: #a09880; margin-top: 16px; }
  </style>
</head>
<body>
<h1>🔯 梅花心易 占断</h1>

<label>質問</label>
<input type="text" id="question" placeholder="例：転職すべきか" value="転職すべきか">

<label>ドメイン</label>
<select id="domain">
  <option value="WORK">仕事</option>
  <option value="LOVE">恋愛</option>
  <option value="MONEY">金運</option>
  <option value="HEALTH">健康</option>
</select>

<label>本卦（上卦）</label>
<select id="benUpper">
  <option value="乾">乾（金）</option><option value="兌">兌（金）</option>
  <option value="離">離（火）</option><option value="震">震（木）</option>
  <option value="巽">巽（木）</option><option value="坎">坎（水）</option>
  <option value="艮">艮（土）</option><option value="坤">坤（土）</option>
</select>

<label>本卦（下卦）</label>
<select id="benLower">
  <option value="乾">乾（金）</option><option value="兌">兌（金）</option>
  <option value="離">離（火）</option><option value="震">震（木）</option>
  <option value="巽">巽（木）</option><option value="坎">坎（水）</option>
  <option value="艮">艮（土）</option><option value="坤">坤（土）</option>
</select>

<label>之卦</label>
<select id="zhiGua">
  <option value="乾">乾（金）</option><option value="兌">兌（金）</option>
  <option value="離">離（火）</option><option value="震">震（木）</option>
  <option value="巽">巽（木）</option><option value="坎">坎（水）</option>
  <option value="艮">艮（土）</option><option value="坤">坤（土）</option>
</select>

<button onclick="divine()">🔮 占断する</button>
<div id="loading">Claude が断辞を生成中…</div>
<div id="result"></div>

<script>
const HEXAGRAM_DATA = {
  "乾":{"wuxing":"金","number":1},"兌":{"wuxing":"金","number":2},
  "離":{"wuxing":"火","number":3},"震":{"wuxing":"木","number":4},
  "巽":{"wuxing":"木","number":5},"坎":{"wuxing":"水","number":6},
  "艮":{"wuxing":"土","number":7},"坤":{"wuxing":"土","number":8}
};
const WUXING_SHENG = { 木:"火",火:"土",土:"金",金:"水",水:"木" };
const WUXING_KE   = { 木:"土",火:"金",土:"水",金:"木",水:"火" };

function getRelation(a, b) {
  if (WUXING_SHENG[a]===b) return "SEI_A";   // aがbを生じる
  if (WUXING_SHENG[b]===a) return "SEI_B";   // bがaを生じる
  if (WUXING_KE[a]===b)    return "KOKU_A";  // aがbを剋す
  if (WUXING_KE[b]===a)    return "KOKU_B";  // bがaを剋す
  return "SAME";
}

function judgeRelation(tiW, youW, tiN, youN) {
  if (tiW === youW) return "SAME_ELEMENT";
  const r = getRelation(tiW, youW);
  if (r === "KOKU_A") return tiN > youN ? "TAI_STRONG_YOU_WEAK" : "TAI_KOKU_YOU";
  if (r === "KOKU_B") return youN > tiN ? "YOU_STRONG_TAI_WEAK" : "YOU_KOKU_TAI";
  if (r === "SEI_A")  return "TAI_SEI_YOU";
  if (r === "SEI_B")  return "YOU_SEI_TAI";
  return "MIXED";
}

async function divine() {
  const question  = document.getElementById("question").value;
  const domain    = document.getElementById("domain").value;
  const benUpper  = document.getElementById("benUpper").value;
  const benLower  = document.getElementById("benLower").value;
  const zhiName   = document.getElementById("zhiGua").value;

  const upper  = HEXAGRAM_DATA[benUpper];
  const lower  = HEXAGRAM_DATA[benLower];
  const zhi    = HEXAGRAM_DATA[zhiName];
  const relation = judgeRelation(upper.wuxing, zhi.wuxing, upper.number, lower.number);

  document.getElementById("loading").style.display = "block";
  document.getElementById("result").innerHTML = "";

  const systemPrompt = `あなたは梅花心易の専門家です。以下の指示に従って占断してください：
- 体卦・用卦の五行生剋を中心に判断せよ
- 回答は日本語で、具体的かつ実践的な断辞とせよ
- 200字程度でまとめよ`;

  const userPrompt = `【占断依頼】
質問：${question}
ドメイン：${domain}
体卦（本卦上卦）：${benUpper}（${upper.wuxing}）
用卦（之卦）：${zhiName}（${zhi.wuxing}）
体用関係：${relation}

上記を踏まえて断辞を述べよ。`;

  try {
    const res = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: [{ role: "user", content: userPrompt }]
      })
    });
    const data = await res.json();
    const text = data.content?.[0]?.text ?? "エラーが発生しました";

    const polarityMap = { TAI_KOKU_YOU:"BAD", YOU_KOKU_TAI:"BAD", YOU_SEI_TAI:"GOOD", TAI_SEI_YOU:"GOOD", SAME_ELEMENT:"NEUTRAL", TAI_STRONG_YOU_WEAK:"BAD", YOU_STRONG_TAI_WEAK:"BAD", MIXED:"NEUTRAL" };
    const polarity = polarityMap[relation] ?? "NEUTRAL";
    const labelMap = { GOOD:"吉", BAD:"凶", NEUTRAL:"中庸" };

    document.getElementById("result").innerHTML =
      `<span class="badge ${polarity}">${labelMap[polarity]}｜${relation}</span><br>${text}`;
  } catch(e) {
    document.getElementById("result").textContent = "API呼び出しエラー: " + e.message;
  } finally {
    document.getElementById("loading").style.display = "none";
  }
}
</script>
</body>
</html>
